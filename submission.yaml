submission:
  title: "Solar Monitor - Solar Panel Fault Detection"
  problem_statement: >
    Solar panel faults such as hotspots, damaged cells, cracks, dirt, and abnormal
    temperature regions can reduce energy generation and may remain unnoticed during
    routine inspection.
  solution_summary: >
    Solar Monitor analyzes a solar-panel image, identifies suspicious faulty regions,
    and highlights them with a red circle so that an operator can quickly inspect the
    panel. The prototype is designed to work without OpenCV and provides a simple,
    reproducible local workflow.
  key_features:
    - "Solar-panel image input"
    - "Fault-region detection and localization"
    - "Red-circle highlighting of suspicious regions"
    - "Human-readable detection report"
    - "Simple command-line execution without OpenCV"
